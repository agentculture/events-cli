# markdownlint-cli2 config for events-cli.
# markdownlint-cli2 stops walking at the git root, so a per-user global config
# in the home directory isn't picked up from inside the repo.
# Mirrors the guildmaster / steward / agentfront preset for workspace consistency.

config:
  default: true
  # MD013: Line length — disabled. Prose lines wrap at the reader.
  MD013: false
  # MD060: Table pipe spacing — disabled (stylistic preference).
  MD060: false
  # MD024: Duplicate headings — allow under different parents so Keep a
  # Changelog entries can each have ### Added / ### Changed / ### Fixed.
  MD024:
    siblings_only: true

ignores:
  - "node_modules/**"
  - ".local/**"
  - ".afi/**"
  - ".agentfront/**"
  # Vendored skills are cited verbatim from guildmaster — do not reformat them.
  - ".claude/skills/**"
  # Installed dependencies ship their own markdown; CI lints after `uv sync`,
  # so without this the gate would grade third-party docs.
  - ".venv/**"
  # devague working state (reviews, questions) is gitignored and never reaches
  # a fresh checkout — linting it only fails locally.
  - ".devague/**"
