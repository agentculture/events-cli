# SonarCloud project identity. Matches the project key registered on
# SonarCloud and used by the cicd skill's Sonar status queries
# (`agentculture_events-cli`).
sonar.projectKey=agentculture_events-cli
sonar.organization=agentculture

# Source layout — package lives at the top level (no src/ wrapper). The import
# package is `events_cli`; `events-cli` is the distribution and `events` the
# console command.
sonar.sources=events_cli
sonar.tests=tests

# Coverage report produced in CI by `uv run pytest --cov-report=xml:coverage.xml`
# (see .github/workflows/tests.yml). Path is relative to the repo root.
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12

# Don't analyze noise.
sonar.exclusions=**/__pycache__/**,**/.venv/**,uv.lock,.claude/skills/**

# --- narrow, justified rule suppressions ------------------------------------
# S5332 ("Using MQTT protocol is insecure. Use MQTTS instead.") fires on the
# `mqtt://127.0.0.1:1883` endpoint string that `events status` reports.
#
# It does not hold for this deployment, and switching to MQTTS would make the
# product worse:
#   * The broker is loopback-only BY CONSTRUCTION — the compose mapping is the
#     literal `127.0.0.1:1883:1883`, pinned by a unit test and verified live
#     (a connect to this host's own LAN address is refused). The traffic never
#     leaves the loopback interface, so TLS would protect it from nobody who
#     could not already read the process's memory.
#   * Issue #3 explicitly accepts anonymous auth on loopback, and its acceptance
#     criterion 4 REQUIRES a credential-less loopback connect. Demanding certs
#     would break the contract the first consumer was promised.
#   * TLS becomes real the moment the broker is reachable off-box. That is the
#     documented remote-access opt-in, tracked as issue #10, and it is where
#     this rule should bite.
#
# Scoped to the one file and the one rule so a genuine clear-text finding
# anywhere else still fails the gate.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=events_cli/cli/_commands/stack.py

# Block CI on a failing quality gate. The scanner polls SonarCloud and exits
# non-zero on a red gate (coverage regression, new bugs/vulnerabilities). Only
# takes effect when the SonarCloud Scan step runs — that step is guarded by
# `if: env.SONAR_TOKEN != ''` in .github/workflows/tests.yml, so token-less
# repos and fork PRs (no injected secret) skip the scan and stay green.
sonar.qualitygate.wait=true
