# events-cli broker configuration — generated by `events init`.
# Regenerate with `events init --force`; hand edits are overwritten by that.
#
# Target broker: Eclipse Mosquitto 2.1.2, pinned exactly as
# `eclipse-mosquitto:2.1.2-alpine` in compose.yaml (upstream publishes the 2.1
# line only in the `-alpine` form). Every "upstream default" claim
# below was checked against that build, not against the documentation: the
# image reports "mosquitto version 2.1.2" and each default was observed by
# starting the broker with a minimal config and reading its log. The claims are
# version-specific and 2.1 is NOT 2.0 here — re-verify before moving the pin.
#
# ---------------------------------------------------------------------------
# What actually keeps this broker off the network
# ---------------------------------------------------------------------------
# Not this file — the Compose port mapping `127.0.0.1:1883:1883`. Inside its own
# network namespace the container must listen on all interfaces or Docker's
# published port cannot reach it, so `listener 1883` below is correct and is NOT
# a weakening of the upstream local-only behaviour. Moving this broker off
# loopback is a change to compose.yaml, never to this file.
#
# ---------------------------------------------------------------------------
# Upstream defaults in 2.1.2 that this file deliberately does NOT override
# ---------------------------------------------------------------------------
#   * No websocket listener. Nothing here sets `protocol websockets`, so no
#     9001 listener exists and none is published.
#   * No TLS, no bridge, no `include_dir`.
#   * `sys_interval` is 10 seconds. Restated below because it is load-bearing.
#   * `per_listener_settings` is false, so `allow_anonymous` below is global.
#
# ---------------------------------------------------------------------------
# Upstream defaults in 2.1.2 that this file deliberately DOES override
# ---------------------------------------------------------------------------
#   * No `listener` line at all means "local only mode": observed log line
#     "Starting in local only mode. Connections will only be possible from
#     clients running on this machine." We override it with an explicit
#     `listener 1883` for the container-namespace reason above. Named here so
#     the override is visible rather than silent.
#
#   * The 9883 http_api dashboard. This is a 2.1 default with no 2.0
#     equivalent and it is easy to miss: with an EMPTY config file, 2.1.2 still
#     logs "Opening http api listen socket on port 9883" and serves
#     /usr/share/mosquitto/dashboard, and the image's own bundled
#     /mosquitto/config/mosquitto.conf enables that listener explicitly
#     alongside an anonymous 1883. Declaring an explicit `listener` below
#     replaces the default listener set entirely — observed: with `listener
#     1883` present, no 9883 socket is opened. This file therefore has no
#     http_api listener, and compose.yaml publishes no 9883 port.
#
#   * `allow_anonymous` defaults to false. We set it true. That is acceptable
#     only because the port is loopback-bound: the first consumer is a
#     co-located 50 Hz robot control loop that cannot afford a credential
#     round-trip on every publish, and anything able to reach the port is
#     already executing on this host. Per-identity credentials and topic ACLs
#     via the dynamic security plugin are tracked separately; when they land,
#     this line goes away.
#
#   * `persistence` defaults to false. We set it true — see below.

# --- listener --------------------------------------------------------------
listener 1883
allow_anonymous true

# --- persistence -----------------------------------------------------------
# `persistence true` on its own is not enough: with no volume mounted at
# persistence_location the database lands in the container's writable layer and
# disappears with the container. compose.yaml mounts the named volume
# `events-data` at exactly this path — the setting and the mount are a pair.
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db

# The persistence database is flushed to disk every autosave_interval seconds
# (upstream default 1800). A clean shutdown always writes it, so this interval
# only bounds what an UNCLEAN stop loses — power cut, `docker kill`, OOM kill.
# 60 is stated explicitly so that bound is a documented, measurable number
# rather than an inherited half hour.
autosave_interval 60

# --- backlog bound: queued messages for an offline persistent session ------
# A persistent session (clean_start=false) queues QoS>0 messages published
# while its subscriber is offline. That queue is not unbounded, and the bound
# is measured fact, not documentation guesswork: on 2026-07-24 a scratch
# eclipse-mosquitto:2.1.2-alpine broker was run with this exact template and
# probed directly. 1200 QoS-1 messages were published while the subscriber
# was offline; on resume exactly 1000 arrived, in order, and they were the
# OLDEST ones (m00000 .. m00999) — the 200 newest were dropped. So: 1000 is
# 2.1.2's unconfigured default here, and overflow drops the NEWEST arrival and
# keeps what is already queued — it does not evict the head to make room for
# the tail. A session that overflows loses its most recent events, not its
# oldest.
#
# We restate 1000 explicitly for the same reason autosave_interval above is
# restated: it turns an inherited default into a documented number a later
# task can design and alert against, rather than trusting whatever the next
# image happens to ship. Raising it is not free — every queued message sits
# in broker memory for as long as its session stays offline, multiplied
# across every session that goes quiet at once — so headroom above 1000
# should be sized to a real offline-duration budget, not raised on spec. The
# consume-side design this bound serves (issue #7) is a drainer that polls a
# durable subscription far more often than this number implies — seconds to
# low minutes, not the hours it would take to fill 1000 messages at any
# plausible event rate — so 1000 is ample headroom for that cadence, not a
# limit a healthy drainer should ever approach.
#
# There is no dedicated overflow signal: the only in-band evidence is a
# broker log line, "Outgoing messages are being dropped for client <id>.",
# visible via `events logs` and nowhere else — not a $SYS topic, not a
# distinct disconnect reason. A design that must notice overflow has to watch
# that log line, or, better, drain often enough that reaching it stays
# unrealistic.
max_queued_messages 1000

# --- what persistence does and does not give you ---------------------------
# It restores retained messages and the queued QoS>0 backlog of sessions that
# asked to persist (bounded by max_queued_messages above). A retained message
# is the LAST value published on a topic, handed to each new subscriber: it
# is not a replayable log, and it is not history. Event history is the
# control service's own store, never the broker's.
#
# Delivery here is QoS 1, at-least-once. Consumers must therefore deduplicate on
# the event id; that is a requirement of the contract, not a tuning option.

# --- logging ---------------------------------------------------------------
# stdout, so the container log is the single log surface and `events logs` sees
# everything. compose.yaml caps its size.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
connection_messages true

# --- $SYS ------------------------------------------------------------------
# Upstream default (10 seconds), restated because the compose healthcheck
# subscribes to $SYS/broker/uptime. The probe uses `-E` and returns on SUBACK
# rather than waiting for a publication, so this value does not gate the
# healthcheck today — but lengthening it would if that probe ever waits.
sys_interval 10
