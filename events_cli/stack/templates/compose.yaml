# events-cli broker stack — generated by `events init`.
# Regenerate with `events init --force`; hand edits are overwritten by that.
#
# ---------------------------------------------------------------------------
# Loopback-only by construction
# ---------------------------------------------------------------------------
# The published mapping below is `127.0.0.1:1883:1883`, never a bare
# `1883:1883`. Docker publishes on 0.0.0.0 by default, and the DNAT rules it
# installs are traversed BEFORE the host firewall's filter chain — so a bare
# mapping is reachable from the whole LAN no matter what ufw or firewalld say.
# Pinning the host side to 127.0.0.1 is the only thing keeping this broker off
# the network. Remote access is a deliberate, documented opt-in and is not
# configured here.
#
# The in-container listener still binds every interface (see mosquitto.conf).
# That is not a contradiction: Docker forwards host 127.0.0.1:1883 to the
# container's own address, so a broker listening only on the container's
# loopback would be unreachable through the published port. Reachability is
# decided by this mapping, not by the broker's bind address.

name: events-cli

services:
  broker:
    # Pinned to an exact patch version, never the floating `eclipse-mosquitto:2`
    # tag. A floating tag silently swaps the broker — and its defaults — under a
    # running deployment; the `mosquitto.conf` beside this file documents
    # upstream defaults for this exact version and would quietly go stale.
    # Verified locally: `mosquitto -h` in this image reports "mosquitto version
    # 2.1.2", the image carries the OCI label
    # org.opencontainers.image.version=2.1.2, and the `eclipse-mosquitto:2` tag
    # resolved to digest
    # sha256:9cfdd46ad59f3e3e5f592f6baf57ab23e1ad00605509d0f5c1e9b179c5314d87.
    image: eclipse-mosquitto:2.1.2
    container_name: events-mosquitto
    restart: unless-stopped
    ports:
      # host-address : host-port : container-port
      - "127.0.0.1:1883:1883"
      # Nothing else is published. In particular there is no 9001 websocket
      # listener and no 9883 http_api/dashboard listener — the image's own
      # bundled config enables an unauthenticated 9883 dashboard, and
      # mosquitto.conf replaces that config wholesale so neither exists.
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      # `persistence true` in mosquitto.conf is only half the job: with no volume
      # mounted at the persistence_location the database is written into the
      # container's writable layer and vanishes on the next `down`. The setting
      # and this mount are a pair — omitting either is only ever discovered on
      # the first restart test.
      - events-data:/mosquitto/data
    healthcheck:
      # `$$SYS` — the doubled `$` is deliberate and load-bearing. Compose
      # interpolates `$VAR` in this file, so a single `$SYS` would expand to the
      # empty string and the probe would subscribe to `/broker/uptime`, a topic
      # nothing ever publishes. The healthcheck would then fail forever against
      # a perfectly healthy broker.
      #
      # `-E` exits as soon as the SUBACK arrives, so the probe proves connect +
      # subscribe (the authentication and ACL path) without waiting for a
      # message. `-W 5` bounds it; no probe here can block indefinitely.
      test:
        - CMD
        - mosquitto_sub
        - -h
        - 127.0.0.1
        - -p
        - "1883"
        - -t
        - $$SYS/broker/uptime
        - -E
        - -W
        - "5"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      # The broker logs to stdout (mosquitto.conf), so `events logs` reads the
      # container log. Cap it so a chatty broker cannot fill the disk.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Named, not bind-mounted: the broker runs as uid 1883 inside the container
  # and a host bind mount would need matching ownership on every machine.
  events-data:
